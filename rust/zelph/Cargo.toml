[package]
name = "zelph"
description = "Safe Rust bindings for zelph: a hash-consed semantic graph with compiled networks over it"
build = "build.rs"
homepage = "https://zelph.org"
documentation = "https://zelph.org/rust/"
readme = "README.md"
keywords = ["zelph", "semantic-graph", "reasoning", "knowledge-graph", "inference"]
categories = ["api-bindings", "science", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
zelph-sys = { path = "../zelph-sys", version = "0.1.0" }
